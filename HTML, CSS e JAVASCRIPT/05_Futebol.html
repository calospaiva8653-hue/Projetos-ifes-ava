<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chute ao Gol</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #eeeeee;
        }

        #jogo {
            width: 760px;
            height: 500px;
            position: relative;
            margin: 20px auto;
            overflow: hidden;
            border: 5px solid white;
            background-color: #168c3a;
        }

        #gol {
            width: 520px;
            height: 230px;
            position: absolute;
            left: 50px;
            top: 30px;

            border: 10px solid white;
            border-bottom-width: 6px;            
        }

        #bola {
            width: 44px;
            height: 44px;
            position: absolute;
            left: 288px;
            top: 425px;
            font-size: 40px;
            z-index: 3;
        }

        #btnChutar {
            position: absolute;
            right: 25px;
            top: 220px;

            padding: 12px 22px;
            font-size: 18px;
            cursor: pointer;
        }

        #btnChutar:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <h1>Chute ao Gol</h1>

    <div id="jogo">

        <div id="gol"></div>

        <div id="bola">⚽</div>

        <button id="btnChutar">Chutar</button>

    </div>

    <script>
        const bola = document.getElementById("bola");
        const btnChutar = document.getElementById("btnChutar");

        const posicaoInicialX = 288;
        const posicaoInicialY = 425;

        const totalPassos = 40;

        let posicaoX = posicaoInicialX;
        let posicaoY = posicaoInicialY;

        let passoX;
        let passoY;

        let passosExecutados;
        let intervaloBola;

        btnChutar.addEventListener("click", sortearChute);

        function sortearChute() {
            btnChutar.disabled = true;

            const numero = Math.floor(Math.random() * 6);

            if (numero === 0) {
                chutar(288, 205); // Centro rasteiro
            } else if (numero === 1) {
                chutar(288, 70); // Centro alto
            } else if (numero === 2) {
                chutar(90, 205); // Esquerda rasteira
            } else if (numero === 3) {
                chutar(486, 205); // Direita rasteira
            } else if (numero === 4) {
                chutar(90, 70); // Esquerda alta
            } else {
                chutar(486, 70); // Direita alta
            }
        }

        function chutar(novoDestinoX, novoDestinoY) {
            passosExecutados = 0;
            passoX = (novoDestinoX - posicaoInicialX)/totalPassos; 
            passoY = (novoDestinoY - posicaoInicialY) / totalPassos;
            intervaloBola = setInterval(moverBola, 20);
        }

        function moverBola() {
            posicaoX = posicaoX + passoX;
            posicaoY = posicaoY + passoY;
            bola.style.left = posicaoX + "px";
            bola.style.top = posicaoY + "px";
            passosExecutados++;
            if (passosExecutados >= totalPassos) {
                clearInterval(intervaloBola);
                setTimeout(reposicionarBola, 1000);
            }
        }

        function reposicionarBola() {
            posicaoX = posicaoInicialX;
            posicaoY = posicaoInicialY;

            bola.style.left = posicaoX + "px";
            bola.style.top = posicaoY + "px";

            btnChutar.disabled = false;
        }


        
    </script>

</body>
</html>

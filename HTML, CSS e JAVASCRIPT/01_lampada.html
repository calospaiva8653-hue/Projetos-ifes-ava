<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lâmpada interativa</title>
</head>
<body>
    <h1>Clique na lâmpada</h1>
    <img src="apagada.png" id="lampada" onclick="alternarLampada()" width="180">
    <script>
        let acesa = false;
        function alternarLampada() {
            if (acesa) {
                document.getElementById("lampada").src = "apagada.png";
                acesa = false;
            } else {
                document.getElementById("lampada").src = "acesa.png";
                acesa = true;
            }
        }
    </script>
</body>
</html>
